services:
  - type: web
    name: agri-advisory-platform
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENWEATHER_API_KEY
        sync: false
    autoDeploy: true
