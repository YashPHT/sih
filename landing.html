<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriAdvisory - Smart Farming Platform</title>

  <!-- Preload Inter font for optimal performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <style>
    /* ============================================
       LANDING PAGE BASE STYLES
       ============================================
       Color palette variables support light/dark theme switching.
       Override these in landing-theme.js to customize.
    */
    
    :root {
      /* Light theme (default) */
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafb;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-primary: #10b981;
      --accent-secondary: #3b82f6;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.18);
      
      /* Animation settings */
      --prism-speed: 1.0;
      --glass-blur: 12px;
      
      /* Spacing */
      --spacing-unit: 1rem;
    }
    
    /* Dark theme */
    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --accent-primary: #34d399;
      --accent-secondary: #60a5fa;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    
    /* Reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }
    
    /* Canvas container for prism renderer */
    #prism-canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    
    #prism-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    /* Main content */
    .landing-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    /* Glass effect card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: 1.5rem;
      padding: 3rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      text-align: center;
      transform: translateY(0);
      transition: transform 0.3s ease;
    }
    
    .glass-card:hover {
      transform: translateY(-4px);
    }
    
    @media (prefers-reduced-motion: reduce) {
      .glass-card {
        transition: none;
      }
      .glass-card:hover {
        transform: none;
      }
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      font-size: 1.125rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .cta-button {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      text-decoration: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1.125rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
    }
    
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }
    
    @media (prefers-reduced-motion: reduce) {
      .cta-button {
        transition: none;
      }
      .cta-button:hover {
        transform: none;
      }
    }
    
    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 2rem;
      right: 2rem;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: 2rem;
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      font-size: 1.25rem;
      transition: transform 0.2s ease;
    }
    
    .theme-toggle:hover {
      transform: scale(1.05);
    }
    
    @media (prefers-reduced-motion: reduce) {
      .theme-toggle {
        transition: none;
      }
      .theme-toggle:hover {
        transform: none;
      }
    }
    
    /* Loading state */
    .loading {
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }
    
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
    
    /* Responsive adjustments */
    @media (max-width: 640px) {
      h1 {
        font-size: 2rem;
      }
      .glass-card {
        padding: 2rem;
      }
      .theme-toggle {
        top: 1rem;
        right: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Theme toggle button -->
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <span id="theme-icon">🌙</span>
  </button>

  <!-- Background canvas for prism effects -->
  <div id="prism-canvas-container">
    <canvas id="prism-canvas"></canvas>
  </div>

  <!-- Main landing content -->
  <div class="landing-container loading">
    <div class="glass-card">
      <h1>AgriAdvisory</h1>
      <p>
        Empowering farmers with AI-driven insights for smarter crop planning,
        pest management, and financial services. Join the future of agriculture.
      </p>
      <a href="#" class="cta-button" id="enter-app">Get Started</a>
    </div>
  </div>

  <!-- Landing page scripts -->
  <script type="module" src="/public/js/prismRenderer.js"></script>
  <script type="module" src="/public/js/glassEffect.js"></script>
  <script type="module" src="/public/js/landing-theme.js"></script>
  <script type="module">
    // ============================================
    // LANDING PAGE INITIALIZATION
    // ============================================
    // Handles authentication flow, theme persistence, and navigation
    
    import { PrismRenderer } from '/public/js/prismRenderer.js';
    import { GlassEffect } from '/public/js/glassEffect.js';
    
    // Storage keys for authentication and theme state
    // Update these to match your authentication implementation
    const AUTH_STORAGE_KEY = 'agri_advisory_auth_token';
    const THEME_STORAGE_KEY = 'agri_advisory_theme_preference';
    
    // Initialize visual effects when page loads
    document.addEventListener('DOMContentLoaded', () => {
      // Check if user is already authenticated
      // Redirect to dashboard if auth token exists
      const authToken = localStorage.getItem(AUTH_STORAGE_KEY);
      if (authToken) {
        // User is authenticated, redirect to main app
        window.location.href = '/';
        return;
      }
      
      // Initialize prism background renderer
      const prismRenderer = new PrismRenderer('prism-canvas');
      prismRenderer.start();
      
      // Initialize glass effect enhancements
      const glassEffect = new GlassEffect();
      glassEffect.init();
      
      // Handle enter app button click
      document.getElementById('enter-app').addEventListener('click', (e) => {
        e.preventDefault();
        // In production, this would navigate to login/signup
        // For now, navigate to main app
        window.location.href = '/';
      });
      
      // Restore saved theme preference
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
      }
      
      // Theme toggle functionality
      const themeToggle = document.getElementById('theme-toggle');
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem(THEME_STORAGE_KEY, newTheme);
        updateThemeIcon(newTheme);
        
        // Notify renderers of theme change
        prismRenderer.updateTheme(newTheme);
      });
    });
    
    function updateThemeIcon(theme) {
      const icon = document.getElementById('theme-icon');
      icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      // Prism renderer will auto-cleanup via visibility API
    });
  </script>
</body>
</html>
